<title>Laboratorio Virtual de Ciencias JOSAFI - 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6f9e0;--card:#f9fff6;--tx:#10321a;--mu:#3f6a4a;--ac:#0b7d3e;--ac2:#daf5d3;--bd:#a6e0ad;--ok:#0d7a2f;--ko:#c62828;--okb:#c8f5d0;--kob:#ffd9d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#15803d;color:var(--tx);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.w{width:100%;max-width:none;margin:0;padding:12px clamp(12px,2.5vw,40px);min-height:100vh}
h1{font:900 clamp(1.7rem,6vw,3rem)/1.1 "Trebuchet MS","Segoe UI",system-ui,sans-serif;margin:8px 0;text-align:center;letter-spacing:.5px;color:#fff;text-transform:uppercase;letter-spacing:1.5px;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
h2{font:700 1.25rem Georgia,serif;margin:0 0 8px}
.mu{color:var(--mu);margin:0 0 10px}
nav,.sp{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
button{font:inherit;cursor:pointer;border:2px solid #1e88e5;background:linear-gradient(135deg,#29b6f6,#1e88e5);color:#fff;font-weight:700;border-radius:12px;padding:8px 14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.2)}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
.sp button{flex:1;border-radius:0;border-width:0 0 3px;background:none;padding:8px 6px}
.sp button{color:#fff;border-color:#86efac;box-shadow:none}.sp button.on{background:#fff3a8;color:#d81b60;border-color:#d81b60;border-radius:10px 10px 0 0}
.b{background:var(--ac2);color:var(--ac);border-radius:8px;padding:0 6px;font-size:.8em}
nav .on .b{background:var(--bg);color:var(--ac)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:8px;align-items:start}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
svg{width:100%;height:auto;max-height:68vh;display:block;border-radius:10px}
label{display:block;margin:12px 0}
input[type=range]{width:100%;accent-color:var(--ac)}
.ro{background:var(--ac2);border-radius:10px;padding:10px 12px;margin:12px 0}
.q{border-left:4px solid var(--ac);padding-left:10px}
.go{background:linear-gradient(135deg,#ff9800,#ff4081);border-color:#ff4081;color:#fff;font-weight:700;box-shadow:0 3px 0 #b0225a}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}
.qz{margin:14px 0}
.op{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal;background:#fff9c4;border-color:#fbc02d;color:var(--tx);box-shadow:none}
.op.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.op.ko{background:var(--kob);border-color:var(--ko);color:var(--ko)}
.fb{margin:6px 0 0;font-size:.95rem}
.sc{font-weight:700;font-size:1.1rem}
#pg{color:#fff;font-weight:700}

{n:'Ciclo del agua',i:'💧',
 ex:'El agua puede ser hielo, líquido o vapor. Al cambiar la temperatura, las partículas se mueven más rápido o más lento y el agua cambia de estado: se funde a 0 °C y hierve a 100 °C.',
 q:'¿Qué le pasa al movimiento de las partículas cuando calentamos el agua?',
 pr:'Procedimiento: mueve el control de −20 °C a 120 °C, observa las partículas y registra al menos 4 mediciones, incluidas 0 °C y 100 °C.',

function ui(){
 const e=E[ci],v=V[ci],n=Object.keys(sc).length;
 $('#pg').textContent=S?`Completaste ${n} de ${E.length} evaluaciones. Elige un experimento y avanza por sus cuatro fases.`:'Identifícate para guardar tus evaluaciones. Mientras tanto puedes explorar los experimentos.';
 $('#nav').innerHTML=E.map((x,i)=>`<button class="${i==ci?'on':''}" onclick="go(${i})">${x.i} ${x.n}${sc[i]?` <span class="b">${sc[i].s}/${sc[i].n}</span>`:''}</button>`).join('');
 $('#sp').innerHTML=['1 Exploración','2 Experimentación','3 Observación','4 Evaluación'].map((t,i)=>`<button class="${i==sp?'on':''}" onclick="st(${i})">${t}</button>`).join('');
 let h='';
 if(sp==0)h=`<h2>${e.i} ${e.n}</h2><p>${e.ex}</p><p class="q">${e.q}</p><button class="go" onclick="st(1)">Comenzar a experimentar</button>`;
 else if(sp==1)h=`<h2>Experimentación</h2><p class="mu">${e.pr}</p>`+e.k.map(c=>`<label>${c.l}: <b id="o_${c.id}">${v[c.id]} ${c.u}</b><input type="range" min="${c.a}" max="${c.b}" step="${c.s}" value="${v[c.id]}" oninput="sl('${c.id}',this.value)"></label>`).join('')+`<div class="ro" id="ro">${e.r(v)}</div><button class="go" onclick="rec()">Registrar medición</button> <span class="mu" id="nr">${R[ci].length} registradas</span><p><button onclick="st(2)">Ir a la observación</button></p>`;
 else if(sp==2)h=`<h2>Observación</h2><div class="ro">${e.r(v)}</div>`+(R[ci].length?`<div class="tw"><table><tr>${e.c.map(c=>`<th>${c}</th>`).join('')}</tr>${R[ci].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mu">Aún no hay mediciones. Vuelve a Experimentación y pulsa «Registrar medición».</p>')+`<p><b>Conclusión:</b> ${e.co}</p><button class="go" onclick="st(3)">Ir a la evaluación</button>`;
 else if(!S)h='<h2>Evaluación</h2><p>Para responder y guardar tu evaluación, primero identifícate arriba con tus apellidos, nombres, grado y sección.</p>';
 else{const z=qs(e),at=(P[key(S)]||{ex:{}}).ex[ci],a=A[ci],n=a.filter(x=>x!=null).length;
  if(at&&at.length){const t=at[at.length-1];h=`<h2>Evaluación</h2><p class="sc">Evaluación enviada. Puntaje: ${t.s} de ${t.n}. ${t.s==t.n?'¡Excelente trabajo!':'Sigue practicando.'}</p>`+t.d.map((d,i)=>`<div class="qz"><b>${i+1}. ${d.q}</b><p class="fb">${d.ok?'✅ Correcto.':'❌ Incorrecto.'} Tu respuesta: ${d.r}.${d.ok?'':' Respuesta correcta: '+d.c+'.'} ${d.e||''}</p></div>`).join('')}
  else h=`<h2>Evaluación</h2><p class="mu">Puedes cambiar tus respuestas las veces que quieras. Cuando termines, pulsa «Enviar evaluación»: después ya no se podrá modificar.</p>`+z.map((q,i)=>`<div class="qz"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="op ${a[i]==j?'sel':''}" onclick="pick(${i},${j})">${o}</button>`).join('')}</div>`).join('')+`<p class="mu">${n} de ${z.length} respondidas</p><button class="go" onclick="enviar()" ${n<z.length?'disabled':''}>📤 Enviar evaluación</button>`}
 $('#pn').innerHTML=h;
}
function go(i){ci=i;sp=0;ui()}
function st(i){sp=i;ui()}
function sl(id,x){V[ci][id]=+x;$('#o_'+id).textContent=x+' '+E[ci].k.find(c=>c.id==id).u;$('#ro').innerHTML=E[ci].r(V[ci])}
function rec(){const r=R[ci];r.push(E[ci].w(V[ci]));if(r.length>12)r.shift();$('#nr').textContent=r.length+' registradas'}
function pick(i,j){A[ci][i]=j;ui()}
async function enviar(){if(enviar.b)return;enviar.b=1;try{const a=A[ci],q=qs(E[ci]);if(a.filter(x=>x!=null).length<q.length)return;
 if(!confirm('¿Enviar la evaluación? Después ya no podrás cambiar tus respuestas.'))return;
 const d=q.map((z,k)=>({q:z[0],r:z[1][a[k]],c:z[1][z[2]],ok:a[k]==z[2],e:z[3]})),s=d.filter(x=>x.ok).length,f=new Date().toLocaleString('es-PE'),m=R[ci].length;
 if(window.FBX){try{await FBX.put(key(S)+'__'+ci,{sid:key(S),a:S.a,no:S.no,g:S.g,sec:S.s,exp:ci,expName:E[ci].n,f,pts:s,n:q.length,m,d})}catch(x){return alert('No se pudo enviar. Si ya enviaste esta evaluación desde otro equipo no se puede repetir; si no, revisa tu conexión e inténtalo de nuevo.')}}
 const p=P[key(S)]||(P[key(S)]={a:S.a,no:S.no,g:S.g,s:S.s,ex:{}});
 (p.ex[ci]=p.ex[ci]||[]).push({f,s,n:q.length,m,d});if(!window.FBX)sv('lab-pr',P);sc[ci]=bst(p.ex[ci]);ui()}finally{enviar.b=0}}
/* ---------- Administrador ---------- */
function aui(){const a=$('#adm');
 if(!ADM){a.innerHTML=window.FBX?`<h2>Administrador</h2><p class="mu">Ingresa con el correo y la clave del docente (Firebase).</p><input type="text" id="em" placeholder="correo" style="max-width:260px"> <input type="password" id="pw" placeholder="clave" style="max-width:200px"> <button class="go" onclick="unlock()">Entrar</button><div id="am"></div>`:`<h2>Administrador</h2><p class="mu">Ingresa la clave del docente.</p><input type="password" id="pw" style="max-width:240px"> <button class="go" onclick="unlock()">Entrar</button><div id="am"></div>`;return}
 const gs={};RO.forEach(x=>{const k=x.g+x.s;gs[k]=(gs[k]||0)+1});
 a.innerHTML=`<h2>Administrador</h2>
 <p class="mu">${window.FBX?'☁️ Conectado a Firebase: los datos se guardan en la nube y se actualizan en tiempo real. <span id="live">· Evaluaciones recibidas: '+cnt()+'</span>':'💾 Modo local (sin Firebase): los datos se guardan solo en este navegador.'}</p>
 <h3>1. Lista de estudiantes</h3><p class="mu">Cargados: <b>${RO.length}</b>${Object.keys(gs).sort().map(k=>` · ${k}: ${gs[k]}`).join('')}</p>
 <input type="file" id="fx" accept=".xlsx,.xls" onchange="PF=this.files[0]"><br><button class="go" onclick="cargar()">⬆️ Cargar lista</button> <button onclick="plantilla()">⬇️ Descargar plantilla Excel</button> <button onclick="borrarLista()">🗑️ Borrar lista</button>
 <h3>2. Preguntas por evaluación</h3><select id="nq" onchange="cfgN(+this.value)">${[1,2,3,4,5].map(x=>`<option ${x==CFG.n?'selected':''}>${x}</option>`).join('')}</select>
 <h3>3. Progreso y evaluaciones</h3><button class="go" onclick="progreso()">⬇️ Descargar progreso de todos (Excel)</button>
 ${window.FBX?`<h3>4. Sesión</h3><button onclick="salirAdm()">Cerrar sesión de administrador</button>`:`<h3>4. Clave de administrador</h3><input type="password" id="np" placeholder="Nueva clave" style="max-width:200px"> <button onclick="if($('#np').value.length>3){PIN=$('#np').value;sv('lab-pin',PIN);am('Clave cambiada.')}else am('Mínimo 4 caracteres.')">Cambiar</button>`}
 <h3>5. Empezar de cero</h3><p class="mu">Elimina el progreso y las evaluaciones de todos los estudiantes. La lista de estudiantes se conserva.</p><button class="danger" onclick="reiniciar()">🧹 Eliminar todos los registros</button>
 <div class="ro" id="am"></div>`}
async function reiniciar(){if(prompt('Esto borra TODO el progreso y las evaluaciones. Escribe BORRAR para confirmar:')!=='BORRAR')return am('No se borró nada.');
 try{if(window.FBX)await FBX.clear();else sv('lab-pr',{})}catch(x){return am('No se pudo borrar en la nube. Revisa tu sesión de administrador.')}
 P={};sc={};A=E.map(()=>[]);R=E.map(()=>[]);ORD=[];ui();am('Registros eliminados. Se empezó de cero.')}
function borrarLista(){if(!confirm('¿Borrar la lista cargada?'))return;RO=[];S=null;if(window.FBX)FBX.saveCfg({estudiantes:[]}).catch(()=>am('No se pudo guardar en la nube.'));else sv('lab-ro',RO);idui();aui()}
function cfgN(n){CFG.n=n;ORD=[];A=E.map(()=>[]);if(window.FBX)FBX.saveCfg({n}).then(()=>am('Guardado en la nube: '+n+' preguntas por evaluación.')).catch(()=>am('No se pudo guardar en la nube.'));else{sv('lab-cfg',CFG);am('Guardado: '+n+' preguntas por evaluación.')}}
async function unlock(){
 if(window.FBX){try{await FBX.login($('#em').value.trim(),$('#pw').value)}catch(x){return am('Correo o clave incorrectos.')}
  UN=FBX.watch(ds=>{P={};ds.forEach(x=>{const p=P[x.sid]||(P[x.sid]={a:x.a,no:x.no,g:x.g,s:x.sec,ex:{}});(p.ex[x.exp]=p.ex[x.exp]||[]).push({f:x.f,s:x.pts,n:x.n,m:x.m,d:x.d})});if($('#live'))$('#live').textContent='· Evaluaciones recibidas: '+cnt()},()=>{ADM=false;aui();am('Esta cuenta no tiene permiso de administrador.')});
  ADM=true;aui();return}
 if($('#pw').value===PIN){ADM=true;aui()}else am('Clave incorrecta.')}
function salirAdm(){ADM=false;if(UN)UN();UN=null;P={};S=null;sc={};FBX.logout();aui();idui()}
function parse(wb){const out=[];wb.SheetNames.forEach(n=>{let g=null,s=null,t='';XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}).forEach(r=>{
 const h=r.find(c=>typeof c==='string'&&/^\s*[1-6]\s*[A-Za-z]\s*[-–]/.test(c));
 if(h){const m=h.match(/^\s*(\d)\s*([A-Za-z])\s*[-–]\s*(.*)$/);g=m[1];s=m[2].toUpperCase();t=m[3];return}
 const i=r.findIndex(c=>typeof c==='number');
 if(g&&i>=0&&typeof r[i+1]==='string'&&r[i+1].trim()){const nm=r[i+1].replace(/\s+/g,' ').trim(),dni=r[i+2]!=null?String(r[i+2]).trim():'';if(dni==='00000000')return;const k=nm.indexOf(',');
  out.push({a:k<0?nm:nm.slice(0,k).trim(),no:k<0?'':nm.slice(k+1).trim(),dni,g,s,t,x:/NO ASISTE/i.test(String(r[i+3]||''))})}})});return out}
function cargar(){const f=PF;if(!f)return am('Primero selecciona el archivo de la lista de estudiantes.');if(typeof XLSX==='undefined')return am('No se cargó la librería de Excel. Revisa tu conexión a internet.');
 const rd=new FileReader();rd.onload=e=>{try{const o=parse(XLSX.read(new Uint8Array(e.target.result),{type:'array'}));
  if(!o.length)return am('No se encontraron estudiantes. Usa la plantilla: cada bloque debe empezar con «1A - TUTOR...», seguido de N°, APELLIDOS Y NOMBRES y DNI.');
  o.forEach(x=>{delete x.dni});RO=o;PF=null;S=null;
  if(window.FBX)return FBX.saveCfg({estudiantes:o.map(x=>({a:x.a,no:x.no,g:x.g,s:x.s,t:x.t})),n:CFG.n}).then(()=>{idui();aui();am('Lista cargada en la nube: '+o.length+' estudiantes.')}).catch(()=>am('No se pudo guardar en la nube. Revisa tu sesión de administrador.'));
  sv('lab-ro',RO);idui();aui();am('Lista cargada: '+o.length+' estudiantes.')}catch(x){am('No se pudo leer el archivo.')}};rd.readAsArrayBuffer(f)}
function plantilla(){if(typeof XLSX==='undefined')return am('No se cargó la librería de Excel. Revisa tu conexión a internet.');
 const rows=[[],[null,'LISTA DE ESTUDIANTES - "JOSAFI" - 2026']],mg=[{s:{r:1,c:1},e:{r:1,c:3}}];
 ['1A','1B','2A','2B','3A','3B','4A','4B','5A','5B'].forEach((k,j)=>{const r0=rows.length;rows.push([null,k+' - TUTOR(A): PROF. NOMBRES Y APELLIDOS']);mg.push({s:{r:r0,c:1},e:{r:r0,c:3}});rows.push([null,'N°','APELLIDOS Y NOMBRES','DNI']);
  for(let n=1;n<=15;n++)rows.push([null,n,j==0&&n==1?'APELLIDO1 APELLIDO2, NOMBRES':null,j==0&&n==1?'00000000':null]);rows.push([])});
 const ws=XLSX.utils.aoa_to_sheet(rows);ws['!merges']=mg;ws['!cols']=[{wch:3},{wch:6},{wch:45},{wch:14},{wch:3},{wch:70}];
 ['INSTRUCCIONES','1) Cada bloque empieza con grado y sección, un guion y el tutor. Ej.: 2B - TUTORA: PROF. ...','2) Escriba APELLIDOS Y NOMBRES así: APELLIDOS, NOMBRES (con coma) y el DNI.','3) La fila de ejemplo (DNI 00000000) se ignora al cargar: reemplácela o bórrela.','4) Si una sección tiene más de 15 estudiantes, inserte filas dentro del bloque.','5) Guarde como .xlsx y cárguelo en Administrador.'].forEach((t,i)=>{ws['F'+(i+2)]={t:'s',v:t}});
 ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:5}});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'LISTA GENERAL');XLSX.writeFile(wb,'plantilla-lista-estudiantes-JOSAFI-2026.xlsx')}
function bord(ws,rows){const r=XLSX.utils.decode_range(ws['!ref']),b={style:'thin',color:{rgb:'000000'}};
 for(let R=r.s.r;R<=r.e.r;R++)for(let C=r.s.c;C<=r.e.c;C++){const a=XLSX.utils.encode_cell({r:R,c:C}),c=ws[a]||(ws[a]={t:'s',v:''});c.s={border:{top:b,bottom:b,left:b,right:b},alignment:{vertical:'center',wrapText:true,horizontal:R<2?'center':'left'},font:{bold:R<2}}}
 ws['!cols']=Array.from({length:r.e.c+1},(_,C)=>({wch:Math.min(42,Math.max(10,...rows.map((x,i)=>(i==0&&C>=2&&C<rows[0].length-1?'':String(x[C]??'')).length+2)))}))}
function progreso(){if(typeof XLSX==='undefined')return am('No se cargó la librería de Excel. Revisa tu conexión a internet.');
 const secs=[...new Set([...RO.map(x=>x.g+x.s),...Object.values(P).map(p=>p.g+p.s)])].sort();
 if(!secs.length)return am('No hay estudiantes cargados ni evaluaciones guardadas.');
 const H1=['Grado y sección','Apellidos y nombres',...E.flatMap(e=>[e.n,'']),'Puntaje total'],H2=['','',...E.flatMap(()=>['Puntaje','Mediciones']),''],L=2+2*E.length,
 mg=[{s:{r:0,c:0},e:{r:1,c:0}},{s:{r:0,c:1},e:{r:1,c:1}},...E.map((e,i)=>({s:{r:0,c:2+2*i},e:{r:0,c:3+2*i}})),{s:{r:0,c:L},e:{r:1,c:L}}],wb=XLSX.utils.book_new();
 secs.forEach(c=>{const r1=[H1,H2],ls=[...RO.filter(x=>x.g+x.s==c),...Object.values(P).filter(p=>p.g+p.s==c&&!RO.some(x=>key(x)==key(p)))];
  ls.forEach(x=>{const p=P[key(x)],row=[c,x.a+', '+x.no];let t=0,m=0;E.forEach((e,i)=>{const b=bst(p&&p.ex[i]||[]);if(b)t+=b.s;m+=b?b.n:CFG.n;row.push(b?b.s+'/'+b.n:'',b?b.m:'')});row.push(t+'/'+m);r1.push(row)});
  const ws=XLSX.utils.aoa_to_sheet(r1);ws['!merges']=mg;bord(ws,r1);XLSX.utils.book_append_sheet(wb,ws,c)});
 XLSX.writeFile(wb,'progreso-JOSAFI-2026.xlsx')}
function loop(ms){$('#sv').innerHTML=BG+E[ci].d(V[ci],ms/1000);requestAnimationFrame(loop)}
addEventListener('fbready',async()=>{if(!window.FBX)return;P={};try{const c=await FBX.cfg();RO=(c&&c.estudiantes)||[];if(c&&c.n)CFG.n=c.n}catch(x){RO=[]}idui();ui();if(window.FBERR)msg('No se pudo conectar con Firebase ('+FBERR+'). Avisa al docente.')});
